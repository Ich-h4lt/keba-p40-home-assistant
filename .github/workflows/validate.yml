name: Validate

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest

    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            custom_components/keba_p40 \
            python_tool/keba_phase_toggle.py

      - name: Validate JSON files
        run: |
          python -m json.tool \
            custom_components/keba_p40/manifest.json >/dev/null
          python -m json.tool \
            custom_components/keba_p40/strings.json >/dev/null
          python -m json.tool \
            custom_components/keba_p40/translations/de.json >/dev/null
          python -m json.tool \
            custom_components/keba_p40/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null
          python -m json.tool api_docs/keba-openapi.json >/dev/null
