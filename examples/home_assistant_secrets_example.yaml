# Legacy YAML example. Add these entries to /config/secrets.yaml.

keba_login_url: "https://192.168.178.50:8443/v2/jwt/login"
keba_login_payload: '{"username":"admin","password":"CHANGE_ME"}'

# Replace 12345678 with the serial number of the wallbox.
keba_wallbox_status_url: "https://192.168.178.50:8443/v2/wallboxes/12345678"
keba_load_management_url: "https://192.168.178.50:8443/v2/configs/lmgmt"

# The template is evaluated when script.keba_phases_setzen supplies "phases".
keba_phase_toggle_url: "https://192.168.178.50:8443/v2/wallboxes/12345678/phase-toggle?numberOfPhases={{ phases | int }}"
